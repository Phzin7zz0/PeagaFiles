```yaml
name: Build Peaga Files

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Xcode disponível:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true

          XCODE_PATH=$(ls -d /Applications/Xcode*.app | head -n 1)

          if [ -z "$XCODE_PATH" ]; then
            echo "ERRO: Xcode não encontrado."
            exit 1
          fi

          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          xcodegen version

      - name: Generate Xcode project
        run: |
          xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project PeagaFiles.xcodeproj \
            -scheme PeagaFiles \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Find app
        run: |
          find build -type d -name "PeagaFiles.app" -print

      - name: Create IPA
        run: |
          APP_PATH=$(find build -type d -name "PeagaFiles.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERRO: PeagaFiles.app não encontrado."
            exit 1
          fi

          rm -rf Payload
          mkdir Payload

          cp -R "$APP_PATH" Payload/PeagaFiles.app

          zip -r PeagaFiles.ipa Payload

          echo "IPA criado:"
          ls -lh PeagaFiles.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PeagaFiles-IPA
          path: PeagaFiles.ipa
          if-no-files-found: error
```
