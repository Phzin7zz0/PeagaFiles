name: PeagaFiles

options:
  bundleIdPrefix: com.peaga
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  PeagaFiles:
    type: application
    platform: iOS

    sources:
      - path: .

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peaga.PeagaFiles
        INFOPLIST_KEY_CFBundleDisplayName: Peaga Files
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

    scheme:
      testTargets: []
      gatherCoverageData: false
